name: Melon Ticket Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check ticket and send email
        run: |
          RESULT=$(curl -s \
            "https://ticket.melon.com/tktapi/product/block/summary.json?v=1" \
            --data "prodId=213100&scheduleNo=1&perfDate=20260619&pocCode=MELT" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Cookie: ${{ secrets.MELON_COOKIE }}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Referer: https://ticket.melon.com/reservation/popup/stepBlock.htm" \
            -H "Origin: https://ticket.melon.com")
          
          echo "Result: $RESULT"
          
          if echo "$RESULT" | grep -q '"remainCnt":[^0]'; then
            python3 - <<EOF
          import smtplib
          from email.mime.text import MIMEText
          msg = MIMEText('Melon Ticket 有余票了！快去抢！\nhttps://ticket.melon.com/performance/index.htm?prodId=213100')
          msg['Subject'] = '🎫 TREASURE票有了！快去抢！'
          msg['From'] = '${{ secrets.GMAIL_USER }}'
          msg['To'] = '${{ secrets.NOTIFY_EMAIL }}'
          s = smtplib.SMTP('smtp.gmail.com', 587)
          s.starttls()
          s.login('${{ secrets.GMAIL_USER }}', '${{ secrets.GMAIL_PASS }}')
          s.send_message(msg)
          s.quit()
          print('邮件已发送！')
          EOF
          fi
