name: Melon Ticket Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check ticket and send email
        env:
          MELON_COOKIE: ${{ secrets.MELON_COOKIE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          echo "$MELON_COOKIE" > /tmp/cookie.txt
          RESULT=$(curl -s 'https://ticket.melon.com/tktapi/product/summary.json?v=1&callback=getBlockGradeSeatCountCallBack' \
            -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
            -H 'Origin: https://ticket.melon.com' \
            -H 'Referer: https://ticket.melon.com/reservation/popup/stepBlock.htm' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' \
            -H 'X-Requested-With: XMLHttpRequest' \
            -b /tmp/cookie.txt \
            --data-raw 'prodId=213100&pocCode=SC0002&scheduleNo=100001&perfDate=20260619&corpCodeNo=')
          echo "Result: $RESULT"
          if echo "$RESULT" | grep -q '"realSeatCntlk":[^0]'; then
            curl -s "https://sctapi.ftqq.com/SCT356777ThVapkth4TcyNyeYp7XXMhu67.send" \
              --data-urlencode "title=🎫 TREASURE有票了！快去抢！" \
              --data-urlencode "desp=韩版有余票出现！立即打开购票页面！https://ticket.melon.com/performance/index.htm?prodId=213100"
            python3 -c "
          import smtplib, os
          from email.mime.text import MIMEText
          msg = MIMEText('TREASURE票有余票了！快去抢！\nhttps://ticket.melon.com/performance/index.htm?prodId=213100')
          msg['Subject'] = 'TREASURE票有了！快去抢！'
          msg['From'] = os.environ['GMAIL_USER']
          msg['To'] = os.environ['NOTIFY_EMAIL']
          s = smtplib.SMTP('smtp.gmail.com', 587)
          s.starttls()
          s.login(os.environ['GMAIL_USER'], os.environ['GMAIL_PASS'])
          s.send_message(msg)
          s.quit()
          "
          fi
